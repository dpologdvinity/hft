name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-train.txt
            constraints.txt
      # Pinned CPU-only stack; tests use synthetic fixtures and need no credentials or market data.
      - run: python -m pip install -r requirements-train.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: ruff check hft tests benchmarks scripts
      - run: ruff format --check hft tests benchmarks scripts
      - run: python -m pytest -q
      - name: Offline smoke run (synthetic PPO, ONNX export, replay)
        run: python -m hft smoke --output "$RUNNER_TEMP/smoke"

  cpp:
    name: C++ engine build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-train.txt
            constraints.txt
      - run: python -m pip install cmake ninja
      - run: cmake -S cpp -B cpp/build -G Ninja -DHFTCORE_BUILD_TESTS=ON
      - run: cmake --build cpp/build -j2
      - run: ctest --test-dir cpp/build --output-on-failure
      - run: python -m pip install -r requirements-train.txt
      - run: python -m pip install --no-deps -e . ./cpp
      - name: Full test suite on the C++ engine
        run: python -m pytest -q
        env:
          HFT_REQUIRE_HFTCORE: "1"
          HFT_ENGINE: cpp

  cpp-sanitize:
    name: C++ tests under AddressSanitizer and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install cmake ninja
      - run: >-
          cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DHFTCORE_SANITIZE=ON -DHFTCORE_BUILD_BENCH=OFF
      - run: cmake --build cpp/build -j2
      - run: ctest --test-dir cpp/build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  frontend:
    name: Dashboard tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend run build
