name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-train.txt
            constraints.txt
      # Pinned CPU-only stack; tests use synthetic fixtures and need no credentials or market data.
      - run: python -m pip install -r requirements-train.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: ruff check hft tests benchmarks scripts
      - run: ruff format --check hft tests benchmarks scripts
      - run: python -m pytest -q
      - name: Offline smoke run (synthetic PPO, ONNX export, replay)
        run: python -m hft smoke --output "$RUNNER_TEMP/smoke"

  frontend:
    name: Dashboard tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend run build
